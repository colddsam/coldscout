name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Install testing tools
        pip install pytest pytest-asyncio aiosqlite flake8 httpx
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Run Backend Tests
      env:
        APP_ENV: testing
        DATABASE_URL: sqlite+aiosqlite:///./test.db
        SUPABASE_URL: https://dummy.supabase.co
        SUPABASE_ANON_KEY: dummy_anon_key
        REDIS_URL: redis://localhost:6379/0
        GOOGLE_PLACES_API_KEY: dummy_google_key
        GROQ_API_KEY: dummy_groq_key
        BREVO_SMTP_USER: dummy_user
        BREVO_SMTP_PASSWORD: dummy_password
        FROM_EMAIL: test@example.com
        REPLY_TO_EMAIL: test@example.com
        IMAP_USER: dummy_imap_user
        IMAP_PASSWORD: dummy_imap_password
        ADMIN_EMAIL: admin@example.com
        APP_SECRET_KEY: dummy_secret_key
        API_KEY: dummy_api_key
        SECURITY_SALT: dummy_security_salt
        FROM_NAME: "Lead Gen Test"
        IMAP_HOST: "imap.gmail.com"
      run: |
        pytest -v

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: npm install
      
    - name: Lint frontend
      run: npm run lint
      
    - name: Build frontend
      run: npm run build

  route-parity:
    # Guards that the web (Next.js) route table and the Android (Vite) route
    # table never drift. Both derive from frontend/src/routes.manifest.ts; this
    # fails the build if a web page is missing for a manifest route, an orphan
    # web page exists, or App.tsx stops being manifest-driven.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install root tooling (esbuild)
      run: npm install --no-audit --no-fund --ignore-scripts

    - name: Check web ⇄ manifest ⇄ Android route parity
      run: node web/scripts/sync-routes.mjs --check

  web-build:
    # Catches web (Next.js) build breakage on every push/PR. The web app reuses
    # ../frontend/src, so this also exercises the shared source under Next.
    # Dummy VITE_* values are supplied so supabase.createClient() (which runs
    # during SSG prerender) doesn't throw — no real secrets are needed to build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm install

    - name: Build web (Next.js)
      env:
        VITE_API_BASE_URL: https://api.example.com
        VITE_API_KEY: dummy_api_key
        VITE_SITE_NAME: Cold Scout
        VITE_APP_BOOKING_URL: https://example.com
        VITE_SUPABASE_URL: https://dummy.supabase.co
        VITE_SUPABASE_ANON_KEY: dummy_anon_key
        VITE_APP_URL: https://example.com
      run: npm run build
