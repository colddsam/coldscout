name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          RUN_NUMBER=${{ github.run_number }}
          VERSION_CODE=$((RUN_NUMBER + 100))
          VERSION_NAME="1.0.${RUN_NUMBER}"
          TAG="android-v${VERSION_NAME}"
          APK_NAME="ColdScout-${VERSION_NAME}.apk"
          AAB_NAME="ColdScout-${VERSION_NAME}.aab"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "AAB_NAME=$AAB_NAME" >> "$GITHUB_OUTPUT"

      - name: Bump versionCode / versionName in build.gradle
        run: |
          GRADLE_FILE=frontend/android/app/build.gradle
          sed -i "s/versionCode .*/versionCode ${{ steps.version.outputs.VERSION_CODE }}/" "$GRADLE_FILE"
          sed -i "s/versionName .*/versionName \"${{ steps.version.outputs.VERSION_NAME }}\"/" "$GRADLE_FILE"
          echo "--- patched build.gradle ---"
          grep -E "versionCode|versionName" "$GRADLE_FILE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create .env for build
        # Vite reads env from the repo root since 2026-05-05 (frontend/vite.config.ts
        # sets envDir to '..'). Writing to ./frontend/.env produces a build with
        # empty VITE_* values, which crashes Supabase init at module load and
        # leaves the Android app on a black screen.
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_SITE_NAME: ${{ secrets.VITE_SITE_NAME }}
          VITE_APP_BOOKING_URL: ${{ secrets.VITE_APP_BOOKING_URL }}
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env
          echo "VITE_API_KEY=$VITE_API_KEY" >> .env
          echo "VITE_SITE_NAME=$VITE_SITE_NAME" >> .env
          echo "VITE_APP_BOOKING_URL=$VITE_APP_BOOKING_URL" >> .env
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_APP_URL=$VITE_APP_URL" >> .env

      - name: Build Web App
        working-directory: ./frontend
        run: npm run build

      - name: Materialize google-services.json
        # The file is gitignored (it's not secret per se, but keeping it
        # out of the repo means anyone who forks doesn't inherit our
        # Firebase project). Provide it via a base64-encoded Actions
        # secret named GOOGLE_SERVICES_JSON_B64 so the Gradle build can
        # find it at frontend/android/app/google-services.json.
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_B64 secret. FCM push will not work in the build."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > frontend/android/app/google-services.json
          echo "Wrote $(wc -c < frontend/android/app/google-services.json) bytes to google-services.json"
          # Print non-sensitive identifiers from the bundled file so a
          # FIS_AUTH_ERROR investigation can confirm the secret hasn't gone
          # stale (e.g. Firebase app deleted + recreated in console while
          # the GH Action secret still holds the old API key).
          python3 - <<'PY'
          import json, sys
          d = json.load(open("frontend/android/app/google-services.json"))
          c = d["client"][0]
          api_key = c["api_key"][0]["current_key"]
          print("::group::Bundled google-services.json fingerprint")
          print("  project_id:      ", d["project_info"]["project_id"])
          print("  project_number:  ", d["project_info"]["project_number"])
          print("  package_name:    ", c["client_info"]["android_client_info"]["package_name"])
          print("  mobilesdk_app_id:", c["client_info"]["mobilesdk_app_id"])
          print("  api_key (last 6):", "..." + api_key[-6:])
          print("::endgroup::")
          PY

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Build Release Artifacts
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign APK Manually
        env:
          KEYSTORE_CONTENT: ${{ secrets.ANDROID_KEYSTORE_CONTENT }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 1. Decode keystore to a file
          echo "$KEYSTORE_CONTENT" | base64 -d > frontend/android/release.keystore

          # 2. Find apksigner
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign | sort -r | head -1)

          # 3. Align the APK
          $ZIPALIGN -v 4 frontend/android/app/build/outputs/apk/release/app-release-unsigned.apk frontend/android/app/build/outputs/apk/release/app-release-aligned.apk

          # 4. Sign the APK
          $APKSIGNER sign --ks frontend/android/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out frontend/android/app/build/outputs/apk/release/ColdScout-Signed-Release.apk \
            frontend/android/app/build/outputs/apk/release/app-release-aligned.apk

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          cp frontend/android/app/build/outputs/apk/release/ColdScout-Signed-Release.apk \
             "release-assets/${{ steps.version.outputs.APK_NAME }}"
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab \
             "release-assets/${{ steps.version.outputs.AAB_NAME }}"
          ls -la release-assets

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --list 'android-v*' --sort=-v:refname | head -n 1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            HEADER="Changes since ${PREV_TAG}:"
          else
            RANGE="HEAD"
            HEADER="Initial release."
          fi
          {
            echo "## Cold Scout Android v${{ steps.version.outputs.VERSION_NAME }}"
            echo ""
            echo "**Build:** \`${{ steps.version.outputs.VERSION_CODE }}\` (\`${{ steps.version.outputs.VERSION_NAME }}\`)"
            echo ""
            echo "### Install"
            echo "- Download \`${{ steps.version.outputs.APK_NAME }}\` and open it on your Android device."
            echo "- Already on Cold Scout? The app will prompt you to update automatically."
            echo ""
            echo "### $HEADER"
            git log --pretty=format:"- %s (%h)" "$RANGE" | head -n 50
          } > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: Cold Scout Android v${{ steps.version.outputs.VERSION_NAME }}
          body_path: release-notes.md
          files: |
            release-assets/${{ steps.version.outputs.APK_NAME }}
            release-assets/${{ steps.version.outputs.AAB_NAME }}
          draft: false
          prerelease: false

      - name: Upload Signed APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ColdScout-Signed-Release.apk
          path: frontend/android/app/build/outputs/apk/release/ColdScout-Signed-Release.apk
          retention-days: 7

      - name: Upload Release AAB (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ColdScout-Release.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
