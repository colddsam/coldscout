name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Create .env for build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_SITE_NAME: ${{ secrets.VITE_SITE_NAME }}
          VITE_APP_BOOKING_URL: ${{ secrets.VITE_APP_BOOKING_URL }}
        run: |
          echo "VITE_API_BASE_URL=$VITE_API_BASE_URL" >> .env
          echo "VITE_API_KEY=$VITE_API_KEY" >> .env
          echo "VITE_SITE_NAME=$VITE_SITE_NAME" >> .env
          echo "VITE_APP_BOOKING_URL=$VITE_APP_BOOKING_URL" >> .env
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          echo "VITE_APP_URL=$VITE_APP_URL" >> .env

      - name: Build Web App
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Build Release Artifacts
        working-directory: ./frontend/android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: frontend/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_CONTENT }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ColdScout-Signed-Release.apk
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 7

      - name: Upload Release AAB (App Bundle for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ColdScout-Release.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
