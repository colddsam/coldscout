name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web App
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor
        working-directory: ./frontend
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        working-directory: ./frontend/android
        run: chmod +x ./gradlew

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Decode Keystore and Build Release
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' && env.STORE_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
        working-directory: ./frontend/android
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > app/keystore.jks
          ./gradlew assembleRelease bundleRelease -Pandroid.injected.signing.storeFile=keystore.jks -Pandroid.injected.signing.storePassword=$STORE_PASSWORD -Pandroid.injected.signing.keyAlias=$KEY_ALIAS -Pandroid.injected.signing.keyPassword=$KEY_PASSWORD

      - name: Upload Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' && env.STORE_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload Release AAB (App Bundle for Play Store)
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEY_PASSWORD != '' && env.KEY_ALIAS != '' && env.STORE_PASSWORD != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAYSTORE_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.PLAYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAYSTORE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.PLAYSTORE_STORE_PASSWORD }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: frontend/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
